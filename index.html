<!DOCTYPE html>

<script>
/* =========================================================================
   MOTOR QR ESTÁNDAR ISO/IEC 18004 (100% COMPATIBLE CON CÁMARA IPHONE / iOS)
   ========================================================================= */
const QREngine = (function() {
    function QR8bitByte(data) {
        this.mode = 4;
        this.data = data;
        this.parsedData = [];
        for (let i = 0; i < this.data.length; i++) {
            let byteArray = [];
            let code = this.data.charCodeAt(i);
            if (code > 0x10000) {
                byteArray[0] = 0xF0 | ((code & 0x1C0000) >>> 18);
                byteArray[1] = 0x80 | ((code & 0x3F000) >>> 12);
                byteArray[2] = 0x80 | ((code & 0xFC0) >>> 6);
                byteArray[3] = 0x80 | (code & 0x3F);
            } else if (code > 0x800) {
                byteArray[0] = 0xE0 | ((code & 0xF000) >>> 12);
                byteArray[1] = 0x80 | ((code & 0xFC0) >>> 6);
                byteArray[2] = 0x80 | (code & 0x3F);
            } else if (code > 0x80) {
                byteArray[0] = 0xC0 | ((code & 0x7C0) >>> 6);
                byteArray[1] = 0x80 | (code & 0x3F);
            } else {
                byteArray[0] = code;
            }
            this.parsedData.push(byteArray);
        }
        this.parsedData = Array.prototype.concat.apply([], this.parsedData);
        if (this.parsedData.length != this.data.length) {
            this.parsedData.unshift(191);
            this.parsedData.unshift(187);
            this.parsedData.unshift(239);
        }
    }
    QR8bitByte.prototype = {
        getLength: function() { return this.parsedData.length; },
        write: function(buffer) {
            for (let i = 0; i < this.parsedData.length; i++) buffer.put(this.parsedData[i], 8);
        }
    };

    // ErrorCorrectLevel: L=1, M=0, Q=3, H=2
    function QRCodeModel(typeNumber, errorCorrectLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectLevel = errorCorrectLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
    }
    QRCodeModel.prototype = {
        addData: function(data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
        isDark: function(row, col) {
            if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) throw new Error(row + "," + col);
            return this.modules[row][col];
        },
        getModuleCount: function() { return this.moduleCount; },
        make: function() { this.makeImpl(false, this.getBestMaskPattern()); },
        makeImpl: function(test, maskPattern) {
            this.moduleCount = this.typeNumber * 4 + 17;
            this.modules = new Array(this.moduleCount);
            for (let row = 0; row < this.moduleCount; row++) {
                this.modules[row] = new Array(this.moduleCount);
                for (let col = 0; col < this.moduleCount; col++) this.modules[row][col] = null;
            }
            this.setupPositionProbePattern(0, 0);
            this.setupPositionProbePattern(this.moduleCount - 7, 0);
            this.setupPositionProbePattern(0, this.moduleCount - 7);
            this.setupPositionAdjustPattern();
            this.setupTimingPattern();
            this.setupTypeInfo(test, maskPattern);
            if (this.typeNumber >= 7) this.setupTypeNumber(test);
            if (this.dataCache == null) this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
            this.mapData(this.dataCache, maskPattern);
        },
        setupPositionProbePattern: function(row, col) {
            for (let r = -1; r <= 7; r++) {
                if (row + r <= -1 || this.moduleCount <= row + r) continue;
                for (let c = -1; c <= 7; c++) {
                    if (col + c <= -1 || this.moduleCount <= col + c) continue;
                    if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                        this.modules[row + r][col + c] = true;
                    } else {
                        this.modules[row + r][col + c] = false;
                    }
                }
            }
        },
        getBestMaskPattern: function() {
            let minLostPoint = 0, pattern = 0;
            for (let i = 0; i < 8; i++) {
                this.makeImpl(true, i);
                let lostPoint = QRUtil.getLostPoint(this);
                if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
            }
            return pattern;
        },
        setupTimingPattern: function() {
            for (let r = 8; r < this.moduleCount - 8; r++) {
                if (this.modules[r][6] != null) continue;
                this.modules[r][6] = (r % 2 == 0);
            }
            for (let c = 8; c < this.moduleCount - 8; c++) {
                if (this.modules[6][c] != null) continue;
                this.modules[6][c] = (c % 2 == 0);
            }
        },
        setupPositionAdjustPattern: function() {
            let pos = QRUtil.getPatternPosition(this.typeNumber);
            for (let i = 0; i < pos.length; i++) {
                for (let j = 0; j < pos.length; j++) {
                    let row = pos[i], col = pos[j];
                    if (this.modules[row][col] != null) continue;
                    for (let r = -2; r <= 2; r++) {
                        for (let c = -2; c <= 2; c++) {
                            this.modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
                        }
                    }
                }
            }
        },
        setupTypeNumber: function(test) {
            let bits = QRUtil.getBCHTypeNumber(this.typeNumber);
            for (let i = 0; i < 18; i++) {
                let mod = (!test && ((bits >> i) & 1) == 1);
                this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            }
            for (let i = 0; i < 18; i++) {
                let mod = (!test && ((bits >> i) & 1) == 1);
                this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
            }
        },
        setupTypeInfo: function(test, maskPattern) {
            let data = (this.errorCorrectLevel << 3) | maskPattern;
            let bits = QRUtil.getBCHTypeInfo(data);
            for (let i = 0; i < 15; i++) {
                let mod = (!test && ((bits >> i) & 1) == 1);
                if (i < 6) this.modules[i][8] = mod;
                else if (i < 8) this.modules[i + 1][8] = mod;
                else this.modules[this.moduleCount - 15 + i][8] = mod;
            }
            for (let i = 0; i < 15; i++) {
                let mod = (!test && ((bits >> i) & 1) == 1);
                if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
                else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
                else this.modules[8][15 - i - 1] = mod;
            }
            this.modules[this.moduleCount - 8][8] = (!test);
        },
        mapData: function(data, maskPattern) {
            let inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
            for (let col = this.moduleCount - 1; col > 0; col -= 2) {
                if (col == 6) col--;
                while (true) {
                    for (let c = 0; c < 2; c++) {
                        if (this.modules[row][col - c] == null) {
                            let dark = false;
                            if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                            let mask = QRUtil.getMask(maskPattern, row, col - c);
                            if (mask) dark = !dark;
                            this.modules[row][col - c] = dark;
                            bitIndex--;
                            if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                        }
                    }
                    row += inc;
                    if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
                }
            }
        }
    };
    QRCodeModel.PAD0 = 0xEC;
    QRCodeModel.PAD1 = 0x11;
    QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
        let rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
        let buffer = new QRBitBuffer();
        for (let i = 0; i < dataList.length; i++) {
            let data = dataList[i];
            buffer.put(data.mode, 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
            data.write(buffer);
        }
        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error("code length overflow");
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
            if (buffer.getLengthInBits() >= totalDataCount * 8) break;
            buffer.put(QRCodeModel.PAD0, 8);
            if (buffer.getLengthInBits() >= totalDataCount * 8) break;
            buffer.put(QRCodeModel.PAD1, 8);
        }
        return QRCodeModel.createBytes(buffer, rsBlocks);
    };
    QRCodeModel.createBytes = function(buffer, rsBlocks) {
        let offset = 0, maxDcCount = 0, maxEcCount = 0;
        let dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (let r = 0; r < rsBlocks.length; r++) {
            let dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;
            maxDcCount = Math.max(maxDcCount, dcCount);
            maxEcCount = Math.max(maxEcCount, ecCount);
            dcdata[r] = new Array(dcCount);
            for (let i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
            offset += dcCount;
            let rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
            let rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
            let modPoly = rawPoly.mod(rsPoly);
            ecdata[r] = new Array(rsPoly.getLength() - 1);
            for (let i = 0; i < ecdata[r].length; i++) {
                let modIndex = i + modPoly.getLength() - ecdata[r].length;
                ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
            }
        }
        let totalCodeCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        let data = new Array(totalCodeCount), index = 0;
        for (let i = 0; i < maxDcCount; i++) {
            for (let r = 0; r < rsBlocks.length; r++) {
                if (i < dcdata[r].length) data[index++] = dcdata[r][i];
            }
        }
        for (let i = 0; i < maxEcCount; i++) {
            for (let r = 0; r < rsBlocks.length; r++) {
                if (i < ecdata[r].length) data[index++] = ecdata[r][i];
            }
        }
        return data;
    };

    const QRUtil = {
        PATTERN_POSITION_TABLE: [
            [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
            [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74],
            [6, 30, 54, 78], [6, 30, 56, 82], [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94],
            [6, 26, 50, 74, 98], [6, 30, 54, 78, 102], [6, 28, 54, 80, 106], [6, 32, 58, 84, 110],
            [6, 30, 58, 86, 114], [6, 34, 62, 90, 118], [6, 26, 50, 74, 98, 122], [6, 30, 54, 78, 102, 126],
            [6, 26, 52, 78, 104, 130], [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138],
            [6, 30, 58, 86, 114, 142], [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150],
            [6, 24, 50, 76, 102, 128, 154], [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162],
            [6, 26, 54, 82, 110, 138, 166], [6, 30, 58, 86, 114, 142, 170]
        ],
        G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
        G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
        G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
        getBCHTypeInfo: function(data) {
            let d = data << 10;
            while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
            return ((data << 10) | d) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
            let d = data << 12;
            while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
            return (data << 12) | d;
        },
        getBCHDigit: function(data) {
            let digit = 0;
            while (data != 0) { digit++; data >>>= 1; }
            return digit;
        },
        getPatternPosition: function(typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
        getMask: function(maskPattern, i, j) {
            switch (maskPattern) {
                case 0: return (i + j) % 2 == 0;
                case 1: return i % 2 == 0;
                case 2: return j % 3 == 0;
                case 3: return (i + j) % 3 == 0;
                case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
                case 5: return (i * j) % 2 + (i * j) % 3 == 0;
                case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
                case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
                default: throw new Error("bad maskPattern:" + maskPattern);
            }
        },
        getErrorCorrectPolynomial: function(errorCorrectLength) {
            let a = new QRPolynomial([1], 0);
            for (let i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
            return a;
        },
        getLengthInBits: function(mode, type) {
            if (1 <= type && type < 10) return 8;
            else if (type < 27) return 16;
            else if (type < 41) return 16;
            else throw new Error("type:" + type);
        },
        getLostPoint: function(qrCode) {
            let moduleCount = qrCode.getModuleCount(), lostPoint = 0;
            for (let row = 0; row < moduleCount; row++) {
                for (let col = 0; col < moduleCount; col++) {
                    let sameCount = 0, dark = qrCode.isDark(row, col);
                    for (let r = -1; r <= 1; r++) {
                        if (row + r < 0 || moduleCount <= row + r) continue;
                        for (let c = -1; c <= 1; c++) {
                            if (col + c < 0 || moduleCount <= col + c || (r == 0 && c == 0)) continue;
                            if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                        }
                    }
                    if (sameCount > 5) lostPoint += (3 + sameCount - 5);
                }
            }
            for (let row = 0; row < moduleCount - 1; row++) {
                for (let col = 0; col < moduleCount - 1; col++) {
                    let count = 0;
                    if (qrCode.isDark(row, col)) count++;
                    if (qrCode.isDark(row + 1, col)) count++;
                    if (qrCode.isDark(row, col + 1)) count++;
                    if (qrCode.isDark(row + 1, col + 1)) count++;
                    if (count == 0 || count == 4) lostPoint += 3;
                }
            }
            for (let row = 0; row < moduleCount; row++) {
                for (let col = 0; col < moduleCount - 6; col++) {
                    if (qrCode.isDark(row, col) && !qrCode.isDark(row, col + 1) && qrCode.isDark(row, col + 2) && qrCode.isDark(row, col + 3) && qrCode.isDark(row, col + 4) && !qrCode.isDark(row, col + 5) && qrCode.isDark(row, col + 6)) lostPoint += 40;
                }
            }
            for (let col = 0; col < moduleCount; col++) {
                for (let row = 0; row < moduleCount - 6; row++) {
                    if (qrCode.isDark(row, col) && !qrCode.isDark(row + 1, col) && qrCode.isDark(row + 2, col) && qrCode.isDark(row + 3, col) && qrCode.isDark(row + 4, col) && !qrCode.isDark(row + 5, col) && qrCode.isDark(row + 6, col)) lostPoint += 40;
                }
            }
            let darkCount = 0;
            for (let col = 0; col < moduleCount; col++) {
                for (let row = 0; row < moduleCount; row++) {
                    if (qrCode.isDark(row, col)) darkCount++;
                }
            }
            let ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
            lostPoint += ratio * 10;
            return lostPoint;
        }
    };

    const QRMath = {
        glog: function(n) { if (n < 1) throw new Error("glog(" + n + ")"); return QRMath.LOG_TABLE[n]; },
        gexp: function(n) { while (n < 0) n += 255; while (n >= 256) n -= 255; return QRMath.EXP_TABLE[n]; },
        EXP_TABLE: new Array(256),
        LOG_TABLE: new Array(256)
    };
    for (let i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
    for (let i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
    for (let i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

    function QRPolynomial(num, shift) {
        let offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (let i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
    }
    QRPolynomial.prototype = {
        get: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
            let num = new Array(this.getLength() + e.getLength() - 1);
            for (let i = 0; i < this.getLength(); i++) {
                for (let j = 0; j < e.getLength(); j++) num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
            }
            return new QRPolynomial(num, 0);
        },
        mod: function(e) {
            if (this.getLength() - e.getLength() < 0) return this;
            let ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
            let num = new Array(this.getLength());
            for (let i = 0; i < this.getLength(); i++) num[i] = this.get(i);
            for (let i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
            return new QRPolynomial(num, 0).mod(e);
        }
    };

    const QRRSBlock = {
        // Tabla oficial completa ISO 18004 para Nivel M (index = (typeNumber - 1) * 4 + 1)
        RS_BLOCK_TABLE: [
            // 1
            [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
            // 2
            [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
            // 3
            [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
            // 4
            [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
            // 5
            [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12],
            // 6
            [2, 86, 68], [4, 43, 27], [4, 43, 19], [4, 43, 15],
            // 7
            [2, 98, 78], [4, 49, 31], [2, 32, 14, 4, 33, 15], [4, 39, 13, 1, 40, 14],
            // 8
            [2, 121, 97], [2, 60, 38, 2, 61, 39], [4, 40, 18, 2, 41, 19], [4, 40, 14, 2, 41, 15],
            // 9
            [2, 146, 116], [3, 58, 36, 2, 59, 37], [4, 36, 16, 4, 37, 17], [4, 36, 12, 4, 37, 13],
            // 10
            [2, 86, 68, 2, 87, 69], [4, 69, 43, 1, 70, 44], [6, 43, 19, 2, 44, 20], [6, 43, 15, 2, 44, 16],
            // 11
            [4, 101, 81], [1, 80, 50, 4, 81, 51], [4, 50, 22, 4, 51, 23], [3, 36, 12, 8, 37, 13],
            // 12
            [2, 116, 92, 2, 117, 93], [6, 58, 36, 2, 59, 37], [4, 46, 20, 6, 47, 21], [7, 42, 14, 4, 43, 15],
            // 13
            [4, 133, 107], [8, 59, 37, 1, 60, 38], [8, 44, 20, 4, 45, 21], [12, 33, 11, 4, 34, 12],
            // 14
            [3, 145, 115, 1, 146, 116], [4, 64, 40, 5, 65, 41], [11, 36, 16, 5, 37, 17], [11, 36, 12, 5, 37, 13],
            // 15
            [5, 109, 87, 1, 110, 88], [5, 65, 41, 5, 66, 42], [5, 54, 24, 7, 55, 25], [11, 36, 12, 7, 37, 13],
            // 16
            [5, 122, 98, 1, 123, 99], [7, 73, 45, 3, 74, 46], [15, 43, 19, 2, 44, 20], [3, 45, 15, 13, 46, 16],
            // 17
            [1, 135, 107, 5, 136, 108], [10, 74, 46, 1, 75, 47], [1, 50, 22, 15, 51, 23], [2, 42, 14, 17, 43, 15],
            // 18
            [5, 150, 120, 1, 151, 121], [9, 69, 43, 4, 70, 44], [17, 50, 22, 1, 51, 23], [2, 42, 14, 19, 43, 15],
            // 19
            [3, 141, 113, 4, 142, 114], [3, 70, 44, 11, 71, 45], [17, 47, 21, 4, 48, 22], [9, 39, 13, 16, 40, 14],
            // 20
            [3, 135, 107, 5, 136, 108], [3, 67, 41, 13, 68, 42], [15, 54, 24, 5, 55, 25], [15, 43, 15, 10, 44, 16]
        ],
        getRSBlocks: function(typeNumber, errorCorrectLevel) {
            let offset = (errorCorrectLevel === 1) ? 0 : (errorCorrectLevel === 0) ? 1 : (errorCorrectLevel === 3) ? 2 : 3;
            let rsBlock = QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + offset];
            let list = [];
            for (let i = 0; i < rsBlock.length / 3; i++) {
                let count = rsBlock[i * 3 + 0];
                let totalCount = rsBlock[i * 3 + 1];
                let dataCount = rsBlock[i * 3 + 2];
                for (let j = 0; j < count; j++) list.push({ totalCount: totalCount, dataCount: dataCount });
            }
            return list;
        }
    };

    function QRBitBuffer() { this.buffer = []; this.length = 0; }
    QRBitBuffer.prototype = {
        get: function(index) { return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) == 1; },
        put: function(num, length) { for (let i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1); },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
            let bufIndex = Math.floor(this.length / 8);
            if (this.buffer.length <= bufIndex) this.buffer.push(0);
            if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
            this.length++;
        }
    };

    return {
        generarCanvas: function(texto, size) {
            let errorLevel = 0; // 0 = Nivel M (15% corrección, módulos más grandes y fáciles de leer por iPhone)
            let typeNumber = 1;
            let byteLen = new QR8bitByte(texto).getLength();
            for (let t = 1; t <= 20; t++) {
                let blocks = QRRSBlock.getRSBlocks(t, errorLevel);
                let cap = 0;
                for (let b = 0; b < blocks.length; b++) cap += blocks[b].dataCount;
                let headerBytes = (t < 10) ? 2 : 3;
                if (byteLen + headerBytes <= cap) { typeNumber = t; break; }
            }
            let qr = new QRCodeModel(typeNumber, errorLevel);
            qr.addData(texto);
            qr.make();

            let count = qr.getModuleCount();
            let margin = 24; // Zona tranquila (Quiet Zone) ampliada para enfoque rápido en iOS
            let innerSize = size - (margin * 2);
            let canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            let ctx = canvas.getContext('2d');
            let tileW = innerSize / count;
            let tileH = innerSize / count;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = '#000000'; // Negro puro de máximo contraste para cámara iPhone
            for (let r = 0; r < count; r++) {
                for (let c = 0; c < count; c++) {
                    if (qr.isDark(r, c)) {
                        ctx.fillRect(
                            Math.floor(margin + c * tileW),
                            Math.floor(margin + r * tileH),
                            Math.ceil(tileW),
                            Math.ceil(tileH)
                        );
                    }
                }
            }
            return canvas;
        }
    };
})();

/* =========================================================================
   LÓGICA DE LA CONSOLA VIP Y FUSIÓN DEL LOGO CORPORATIVO
   ========================================================================= */
const CLAVE_MAESTRA = "CLUB_PRIVADO_2026";
const HORAS_VALIDEZ = 36;
let urlActualGenerada = "";
let nombreActualGenerado = "";
let memoriaPases = [];
let imagenLogoCargada = null;

function mostrarError(msg) {
    const caja = document.getElementById('cajaError');
    caja.innerText = "Aviso técnico: " + msg;
    caja.style.display = 'block';
}

function obtenerStorage(clave, defecto) {
    try {
        const val = localStorage.getItem(clave);
        return val ? JSON.parse(val) : defecto;
    } catch (e) {
        return defecto;
    }
}

function guardarStorage(clave, valor) {
    try {
        localStorage.setItem(clave, JSON.stringify(valor));
    } catch (e) {}
}

function inicializarLogo() {
    const preview = document.getElementById('previewLogo');
    const status = document.getElementById('logoStatus');
    const logoGuardado = obtenerStorage('vip_logo_base64', '');

    const img = new Image();
    img.onload = function() {
        imagenLogoCargada = img;
        preview.src = img.src;
        preview.style.display = 'block';
        status.innerHTML = '<span style="color:#10b981;">● Logo corporativo listo</span>';
        if (urlActualGenerada && memoriaPases[0]) {
            mostrarQR(memoriaPases[0].nombre, memoriaPases[0].exp, memoriaPases[0].url);
        }
    };
    img.onerror = function() {
        status.innerHTML = 'Pulsa <strong>Seleccionar Logo</strong> y elige <code>logopropfast.png</code>';
    };

    if (logoGuardado) {
        img.src = logoGuardado;
    } else {
        img.src = 'logopropfast.png';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const urlGuardada = obtenerStorage('vip_url_base_v2', '');
    if (urlGuardada) {
        document.getElementById('urlWeb').value = urlGuardada;
    }
    memoriaPases = obtenerStorage('vip_historial_v2', []);
    renderizarHistorial();
    inicializarLogo();

    document.getElementById('inputLogo').addEventListener('change', function(e) {
        const archivo = e.target.files[0];
        if (!archivo) return;
        const lector = new FileReader();
        lector.onload = function(evento) {
            const base64 = evento.target.result;
            guardarStorage('vip_logo_base64', base64);
            const img = new Image();
            img.onload = function() {
                imagenLogoCargada = img;
                const preview = document.getElementById('previewLogo');
                preview.src = base64;
                preview.style.display = 'block';
                document.getElementById('logoStatus').innerHTML = '<span style="color:#10b981;">● Logo guardado y activo</span>';
                if (urlActualGenerada && memoriaPases[0]) {
                    mostrarQR(memoriaPases[0].nombre, memoriaPases[0].exp, memoriaPases[0].url);
                }
            };
            img.src = base64;
        };
        lector.readAsDataURL(archivo);
    });

    document.getElementById('estiloLogo').addEventListener('change', () => {
        if (urlActualGenerada && memoriaPases[0]) {
            mostrarQR(memoriaPases[0].nombre, memoriaPases[0].exp, memoriaPases[0].url);
        }
    });

    document.getElementById('btnGenerar').addEventListener('click', generarPase);
    document.getElementById('btnDescargar').addEventListener('click', descargarQRActual);
    document.getElementById('btnCopiar').addEventListener('click', copiarEnlaceActual);
    document.getElementById('btnLimpiar').addEventListener('click', limpiarHistorial);
    
    document.getElementById('nombreInvitado').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generarPase();
    });
});

function generarPase() {
    document.getElementById('cajaError').style.display = 'none';
    try {
        const urlBase = document.getElementById('urlWeb').value.trim();
        const inputNombre = document.getElementById('nombreInvitado');
        const nombre = inputNombre.value.trim();

        if (!urlBase || !nombre) {
            alert("Por favor, rellena tanto la URL como el nombre del invitado.");
            return;
        }

        guardarStorage('vip_url_base_v2', urlBase);

        const ahora = Date.now();
        const expiraEn = ahora + (HORAS_VALIDEZ * 60 * 60 * 1000);
        
        // Formato compacto para reducir densidad del QR y acelerar lectura móvil
        const datosPase = JSON.stringify({
            invitado: nombre,
            key: CLAVE_MAESTRA,
            exp: expiraEn
        });
        
        const token = btoa(encodeURIComponent(datosPase));
        const separador = urlBase.includes('?') ? '&' : '?';
        const urlFinal = `${urlBase}${separador}vip=${token}`;

        mostrarQR(nombre, expiraEn, urlFinal);

        memoriaPases.unshift({
            id: ahora,
            nombre: nombre,
            exp: expiraEn,
            url: urlFinal
        });
        guardarStorage('vip_historial_v2', memoriaPases);
        renderizarHistorial();

        inputNombre.value = "";
        inputNombre.focus();
    } catch (err) {
        mostrarError(err.message);
    }
}

function dibujarLogoRecortado(ctx, img, x, y, size) {
    const aspect = img.naturalWidth / img.naturalHeight;
    let sx = 0, sy = 0, sWidth = img.naturalWidth, sHeight = img.naturalHeight;
    
    if (aspect < 1) {
        sHeight = sWidth;
        sy = (img.naturalHeight - sHeight) * 0.45;
    } else if (aspect > 1) {
        sWidth = sHeight;
        sx = (img.naturalWidth - sWidth) / 2;
    }
    ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, size, size);
}

function mostrarQR(nombre, expiraEn, urlFinal) {
    urlActualGenerada = urlFinal;
    nombreActualGenerado = nombre;

    const fechaLimite = new Date(expiraEn).toLocaleString('es-ES', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });

    const size = 600; // Alta definición 600x600px
    const qrBaseCanvas = QREngine.generarCanvas(urlFinal, size);

    const canvasFinal = document.createElement('canvas');
    canvasFinal.width = size;
    canvasFinal.height = size;
    const ctx = canvasFinal.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    const estilo = document.getElementById('estiloLogo').value;

    if (imagenLogoCargada && estilo === 'fondo') {
        ctx.save();
        ctx.globalAlpha = 0.16;
        const bgSize = size * 0.80;
        const bgOffset = (size - bgSize) / 2;
        dibujarLogoRecortado(ctx, imagenLogoCargada, bgOffset, bgOffset, bgSize);
        ctx.restore();

        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(qrBaseCanvas, 0, 0, size, size);
        ctx.globalCompositeOperation = 'source-over';
    } else {
        ctx.drawImage(qrBaseCanvas, 0, 0, size, size);

        if (imagenLogoCargada && estilo === 'centro') {
            // Proporción segura (19%) para lectura inmediata en cámara iPhone
            const logoSize = size * 0.19;
            const center = size / 2;
            const radio = (logoSize / 2) + 6;

            ctx.save();
            ctx.beginPath();
            ctx.arc(center, center, radio, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#d4af37';
            ctx.stroke();
            ctx.clip();

            dibujarLogoRecortado(ctx, imagenLogoCargada, center - logoSize / 2, center - logoSize / 2, logoSize);
            ctx.restore();
        }
    }

    const contenedorQR = document.getElementById('qrcode');
    contenedorQR.innerHTML = "";
    contenedorQR.appendChild(canvasFinal);

    document.getElementById('textoInvitado').innerText = `Pase exclusivo para: ${nombre}`;
    document.getElementById('textoCaducidad').innerText = `Válido hasta: ${fechaLimite}`;
    document.getElementById('resultado').style.display = 'block';
}

function descargarQRActual() {
    const nombreLimpio = nombreActualGenerado.replace(/\s+/g, '_');
    const canvas = document.querySelector('#qrcode canvas');
    if (canvas) {
        const enlace = document.createElement('a');
        enlace.href = canvas.toDataURL("image/png");
        enlace.download = `Pase_VIP_Propfast_${nombreLimpio}_36h.png`;
        enlace.click();
    }
}

function copiarEnlaceActual() {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(urlActualGenerada).then(() => {
            alert("Enlace VIP copiado al portapapeles.");
        });
    } else {
        prompt("Copia este enlace VIP:", urlActualGenerada);
    }
}

function renderizarHistorial() {
    const contenedor = document.getElementById('listaHistorial');
    document.getElementById('contadorPases').innerText = memoriaPases.length;

    if (memoriaPases.length === 0) {
        contenedor.innerHTML = '<p style="color:#64748b; font-size:0.9rem;">Aún no has emitido ningún pase en esta sesión.</p>';
        return;
    }

    const ahora = Date.now();
    contenedor.innerHTML = memoriaPases.map((pase, index) => {
        const activo = ahora < pase.exp;
        const fechaStr = new Date(pase.exp).toLocaleString('es-ES', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        const estadoHtml = activo 
            ? `<span class="estado-activo">● Activo</span> (hasta ${fechaStr})`
            : `<span class="estado-caducado">● Caducado</span> (${fechaStr})`;

        return `
            <div class="historial-item">
                <div class="historial-info">
                    <div class="historial-nombre">${pase.nombre}</div>
                    <div class="historial-fecha">${estadoHtml}</div>
                </div>
                <div class="historial-acciones">
                    <button type="button" class="btn-mini" onclick="recuperarPase(${index})">Ver QR</button>
                    <button type="button" class="btn-mini" onclick="copiarEnlace(${index})">Copiar Link</button>
                </div>
            </div>
        `;
    }).join('');
}

function recuperarPase(index) {
    const pase = memoriaPases[index];
    if (pase) {
        mostrarQR(pase.nombre, pase.exp, pase.url);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function copiarEnlace(index) {
    const pase = memoriaPases[index];
    if (pase) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(pase.url).then(() => {
                alert(`Enlace de ${pase.nombre} copiado.`);
            });
        } else {
            prompt(`Enlace VIP de ${pase.nombre}:`, pase.url);
        }
    }
}

function limpiarHistorial() {
    if (confirm("¿Seguro que quieres borrar el registro visual de pases?")) {
        memoriaPases = [];
        guardarStorage('vip_historial_v2', []);
        renderizarHistorial();
    }
}
</script>
